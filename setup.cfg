[metadata]
name = file-review-local
version = attr: file_review.__version__
description = Local Git review briefings for coding agents, across programming languages
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
project_urls =
    Source = https://github.com/Belalkf/file-review-local
    Issues = https://github.com/Belalkf/file-review-local/issues
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Operating System :: MacOS
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: Software Development :: Quality Assurance

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = file_review*

[options.package_data]
file_review = *.html, *.css, *.js

[options.entry_points]
console_scripts =
    file-review = file_review.cli:entrypoint
